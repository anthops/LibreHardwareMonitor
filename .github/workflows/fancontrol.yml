name: fancontrol

on:
  push:
    branches: [build/IT5701-fancontrol]

jobs:
  build:
    permissions:
      contents: write
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
      - uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # 5.2.0
        with:
          dotnet-version: '11.0.x'

      - name: Build
        run: dotnet build LibreHardwareMonitorLib/LibreHardwareMonitorLib.csproj -c Release -f net10.0 -p:Platform=x64

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: >-
          gh release create "fancontrol-${{ github.run_number }}"
          bin/Release/x64/net10.0/LibreHardwareMonitorLib.dll
          --target $env:GITHUB_SHA
          --title "FanControl build ${{ github.run_number }}"
          --notes "LibreHardwareMonitorLib (net10.0) built from $env:GITHUB_SHA for FanControl V285."
          --prerelease
